name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Ubuntu GUI build dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libpango1.0-dev libhts-dev

      - name: macOS alignment dependencies
        if: matrix.os == 'macos'
        run: brew install htslib pkg-config

      - name: Install shards
        run: shards install --frozen

      - name: Run specs
        run: crystal spec spec

      - name: Build release executable
        run: shards build --release

  windows:
    name: Windows (MinGW UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-windows
      - run: shards install --frozen
      - name: Test and build with static HTSlib
        run: bash scripts/build-windows.sh
      - name: Verify Windows GUI subsystem and DLL imports
        run: bash scripts/check-windows.sh bin/d4-plot.exe
