name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify bundled IGV.js
        run: |
          node scripts/verify-igv.mjs
          node --check assets/igv_viewer.js

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Ubuntu GUI build dependencies
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libpango1.0-dev libhts-dev

      - name: macOS alignment dependencies
        if: matrix.os == 'macos'
        run: brew install htslib pkg-config

      - name: Install shards
        run: shards install --frozen

      - name: Run specs
        run: crystal spec spec

      - name: Build release executable
        run: |
          shards build d4-plot --release
          shards build d4-plot-server --release

  headless-server:
    name: Headless server (no GTK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install non-GUI native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libhts-dev

      - name: Install shards and verify standalone server
        run: |
          shards install --frozen
          node scripts/verify-igv.mjs
          node --check assets/igv_viewer.js
          shards build d4-plot-server --release
          bin/d4-plot-server --help

  windows:
    name: Windows (MinGW UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/setup-windows
      - name: Verify bundled IGV.js
        run: |
          node scripts/verify-igv.mjs
          node --check assets/igv_viewer.js
      - run: shards install --frozen
      - name: Test and build with static HTSlib
        run: bash scripts/build-windows.sh
      - name: Verify Windows GUI subsystem and DLL imports
        run: |
          bash scripts/check-windows.sh bin/d4-plot.exe gui
          bash scripts/check-windows.sh bin/d4-plot-server.exe console
