name: docs

on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - "src/**"
      - "config/locales/**"
      - "scripts/guide-screenshots.cr"
      - "scripts/build-windows.sh"
      - ".github/actions/setup-windows/**"
      - "assets/**"
      - "README.md"
      - "spec/fixtures/rust-multitrack.d4"
      - "shard.yml"
      - "shard.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  screenshots:
    name: Screenshots (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            executable-suffix: .exe
          - os: macos
            runner: macos-latest
            executable-suffix: ''
          - os: ubuntu
            runner: ubuntu-latest
            executable-suffix: ''
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        if: runner.os != 'Windows'
        with:
          crystal: latest

      - name: Set up Windows native dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install htslib pkg-config

      - name: Install Linux native and capture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libpango1.0-dev libhts-dev \
            xvfb xauth openbox wmctrl imagemagick fonts-noto-cjk

      - name: Build guide application on Unix
        if: runner.os != 'Windows'
        run: |
          shards install --frozen
          mkdir -p bin
          crystal build scripts/guide-screenshots.cr --release --no-debug -o bin/guide-screenshots

      - name: Build guide application on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          shards install --frozen
          bash scripts/build-windows.sh --guide-screenshots

      - name: Prepare scene executables
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable-suffix }}
        run: |
          for scene in overview inspect create-d4; do
            cp "bin/guide-screenshots$EXECUTABLE_SUFFIX" "bin/guide-$scene$EXECUTABLE_SUFFIX"
          done

      - name: Diagnose Windows guide startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class GuideWindowDebug {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] static extern bool EnumWindows(Callback callback, IntPtr data);
            delegate bool Callback(IntPtr hwnd, IntPtr data);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll", SetLastError=true)] public static extern bool GetWindowRect(IntPtr hwnd, out Rect rect);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, StringBuilder value, int size);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr hwnd, StringBuilder value, int size);
            public static string Describe(uint pid) {
              var lines = new StringBuilder();
              EnumWindows((hwnd, data) => {
                uint owner; GetWindowThreadProcessId(hwnd, out owner);
                if (owner != pid) return true;
                var title = new StringBuilder(256); var kind = new StringBuilder(256); Rect rect;
                GetWindowText(hwnd, title, 256); GetClassName(hwnd, kind, 256);
                bool valid = GetWindowRect(hwnd, out rect);
                lines.AppendLine($"HWND={hwnd} visible={IsWindowVisible(hwnd)} bounds={valid} rect={rect.Left},{rect.Top},{rect.Right},{rect.Bottom} class={kind} title={title}");
                return true;
              }, IntPtr.Zero);
              return lines.ToString();
            }
          }
          '@
          $process = Start-Process bin/guide-overview.exe -PassThru -RedirectStandardOutput build/guide-startup.out.txt -RedirectStandardError build/guide-startup.err.txt
          try {
            for ($index = 0; $index -lt 12; $index++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              Write-Host "PID=$($process.Id) exited=$($process.HasExited) main=$($process.MainWindowHandle)"
              Write-Host ([GuideWindowDebug]::Describe([uint32]$process.Id))
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                $rect = New-Object GuideWindowDebug+Rect
                Write-Host "PowerShell bounds=$([GuideWindowDebug]::GetWindowRect($process.MainWindowHandle, [ref]$rect))"
              }
              if ($process.HasExited) { break }
            }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          Get-Content build/guide-startup.out.txt
          Get-Content build/guide-startup.err.txt

      - name: Capture English windows
        uses: kojix2/window-screenshot-action@main
        env:
          D4_PLOT_SCREENSHOT_LOCALE: en
        with:
          os: ${{ matrix.os }}
          app-names: >-
            bin/guide-overview${{ matrix.executable-suffix }}
            bin/guide-inspect${{ matrix.executable-suffix }}
            bin/guide-create-d4${{ matrix.executable-suffix }}
          output-files: >-
            screenshots/${{ matrix.os }}/en/overview.png
            screenshots/${{ matrix.os }}/en/inspect.png
            screenshots/${{ matrix.os }}/en/create-d4.png
          window-timeout: '60'
          capture-delay: '2'

      - name: Capture Japanese windows
        uses: kojix2/window-screenshot-action@main
        env:
          D4_PLOT_SCREENSHOT_LOCALE: ja
        with:
          os: ${{ matrix.os }}
          app-names: >-
            bin/guide-overview${{ matrix.executable-suffix }}
            bin/guide-inspect${{ matrix.executable-suffix }}
            bin/guide-create-d4${{ matrix.executable-suffix }}
          output-files: >-
            screenshots/${{ matrix.os }}/ja/overview.png
            screenshots/${{ matrix.os }}/ja/inspect.png
            screenshots/${{ matrix.os }}/ja/create-d4.png
          window-timeout: '60'
          capture-delay: '2'

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: guide-screenshots-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: error

  build:
    needs: screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Nicolino
        run: |
          wget https://github.com/ralsina/nicolino/releases/latest/download/nicolino-static-linux-amd64
          chmod +x nicolino-static-linux-amd64
          sudo mv nicolino-static-linux-amd64 /usr/local/bin/nicolino

      - name: Build Nicolino guide
        working-directory: guide
        run: |
          nicolino validate
          nicolino build -B -p

      - name: Add captured screenshots to the site
        uses: actions/download-artifact@v8
        with:
          pattern: guide-screenshots-*
          merge-multiple: true
          path: guide/output/screenshots

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: guide/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
