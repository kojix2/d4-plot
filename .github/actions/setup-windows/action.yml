name: Set up MinGW UCRT64
description: Shared native toolchain for build and release; no MSVC ABI mixing
runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git make autoconf automake libtool zip
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-crystal
          mingw-w64-ucrt-x86_64-shards
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-bzip2
          mingw-w64-ucrt-x86_64-xz
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-libdeflate
          mingw-w64-ucrt-x86_64-libtre
          mingw-w64-ucrt-x86_64-libsystre
          mingw-w64-ucrt-x86_64-gettext
