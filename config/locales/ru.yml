    preview_pan: "Предпросмотр: %{region}. Серые области не прочитаны. Отпустите кнопку, чтобы загрузить все дорожки; Esc — отмена."
    help_body: "Откройте файл D4, чтобы показать все его дорожки. «Добавить D4» добавляет ещё один файл. Выберите дорожку по заголовку или в списке; управляйте ею командами «Показать», «Вверх», «Вниз» и «Убрать из вида». Общая Y сравнивает видимые дорожки в одном масштабе. Все файлы должны использовать одну референсную сборку.\nВведите chr:start-end, chr:position или имя хромосомы и нажмите «Перейти». В координатах допускаются запятые.\n\nКоординаты в просмотрщике нумеруются с 1 и включают обе границы. Сигнал показывает среднее в каждом бине с применением знаменателя D4. Увеличьте масштаб, чтобы различить узкие пики; плоский бин может содержать вариацию.\n\nПеретаскивайте для прокрутки; Shift+перетаскивание выбирает диапазон; двойной щелчок увеличивает масштаб; правый щелчок уменьшает. Щёлкните обзор хромосомы, чтобы перейти. «Назад» и «Вперёд» восстанавливают посещённые регионы. Навигация с клавиатуры работает, когда график имеет фокус.\n\nНастройки отображения управляют разрешением, цветом и фиксированным масштабом Y для всех дорожек. Высота задаёт размер строк дорожек. Системная полоса прокрутки перемещает вид по вертикали. Используйте фиксированный масштаб Y при сравнении регионов. D4 не определяет здесь референсную сборку: аннотации должны использовать ту же сборку и точно совпадающие имена хромосом.\n\n«Экспорт бинов» записывает средние выбранной видимой дорожки как bedGraph (с 0, полуоткрытый интервал), а не исходный сигнал для каждого основания."
