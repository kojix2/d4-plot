    help_body: "D4 파일을 열면 모든 트랙이 표시됩니다. D4 추가는 다른 파일을 덧붙입니다. 제목이나 목록에서 트랙을 선택하고 표시, 위로, 아래로, 보기에서 제외로 관리합니다. Y축 공유를 사용하면 표시된 트랙을 하나의 척도로 비교할 수 있습니다. 모든 파일은 같은 참조 어셈블리를 사용해야 합니다.\nchr:start-end, chr:position 또는 염색체 이름을 입력한 다음 이동을 클릭하세요. 좌표에 쉼표를 사용할 수 있습니다.\n\n뷰어의 좌표는 1부터 시작하며 양 끝을 포함합니다. 신호는 D4 분모를 적용한 각 빈의 평균을 표시합니다. 좁은 피크를 확인하려면 확대하세요. 평평한 빈에도 변이가 포함될 수 있습니다.\n\n드래그하여 이동하고 Shift+드래그로 범위를 선택하며, 두 번 클릭하여 확대하고 오른쪽 클릭하여 축소합니다. 염색체 개요를 클릭하면 해당 위치로 이동합니다. 뒤로와 앞으로는 방문한 영역을 복원합니다. 플롯에 포커스가 있을 때 키보드 탐색을 사용할 수 있습니다.\n\n표시 설정에서 모든 트랙의 해상도, 색상 및 고정 Y축 척도를 제어합니다. 높이는 트랙 행 크기를 제어합니다. 기본 스크롤 막대로 세로 이동합니다. 영역을 비교할 때는 고정 Y축 척도를 사용하세요. D4는 여기에서 참조 어셈블리를 식별하지 않으므로 주석은 같은 어셈블리와 정확히 일치하는 염색체 이름을 사용해야 합니다.\n\n빈 내보내기는 원래의 염기별 신호가 아니라 선택한 표시 트랙의 평균을 bedGraph(0부터 시작하는 반개구간)로 기록합니다."
