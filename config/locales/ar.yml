    could_not_open: "تعذر فتح ملف D4"
    could_not_export: "تعذر تصدير الفواصل"
    help_title: "استخدام D4 Plot"
    help_body: "افتح ملف D4 لعرض جميع مساراته. يضيف خيار إضافة D4 ملفًا آخر. حدّد مسارًا من عنوانه أو من القائمة؛ وتتيح لك الأوامر إظهار وأعلى وأسفل وإزالة من العرض إدارته. يقارن Y المشترك المسارات الظاهرة على مقياس واحد. يجب أن تستخدم جميع الملفات تجميعة المرجع نفسها.\nأدخل chr:start-end أو chr:position أو اسم كروموسوم، ثم انقر على انتقال. يمكن استخدام الفواصل في الإحداثيات.\n\nإحداثيات العارض تبدأ من 1 وتشمل الطرفين. تعرض الإشارة المتوسط في كل فاصل بعد تطبيق مقام D4. كبّر لإظهار القمم الضيقة؛ فقد يخفي الفاصل المسطح تباينًا داخله.\n\nاسحب للتحريك؛ واسحب مع Shift لتحديد نطاق؛ وانقر نقرًا مزدوجًا للتكبير؛ وانقر بالزر الأيمن للتصغير. انقر على مخطط الكروموسوم للانتقال. يعيد رجوع وتقدم المناطق التي زرتها. تعمل مفاتيح التنقل عندما يكون الرسم نشطًا.\n\nتتحكم إعدادات العرض في الدقة واللون ومقياس Y الثابت لجميع المسارات. يتحكم الارتفاع في صفوف المسارات. يحرّك شريط التمرير الأصلي العرض رأسيًا. استخدم مقياس Y ثابتًا عند مقارنة المناطق. لا يحدد D4 تجميعة المرجع هنا: يجب أن تستخدم التعليقات التوضيحية التجميعة نفسها وأسماء الكروموسومات المطابقة تمامًا.\n\nيكتب تصدير الفواصل متوسطات المسار الظاهر المحدد بصيغة bedGraph (يبدأ من 0، نصف مفتوح)، وليس الإشارة الأصلية لكل قاعدة."
