    help_body: "Öffnen Sie eine D4-Datei, um alle enthaltenen Spuren anzuzeigen. D4 hinzufügen fügt eine weitere Datei an. Wählen Sie eine Spur über ihren Titel oder die Liste aus; Anzeigen, Nach oben, Nach unten und Entfernen verwalten sie. Gemeinsames Y vergleicht sichtbare Spuren auf einer Skala. Alle Dateien müssen dieselbe Referenzassemblierung verwenden.\nGeben Sie chr:start-end, chr:position oder einen Chromosomennamen ein und klicken Sie auf Los. Kommas in Koordinaten sind zulässig.\n\nKoordinaten im Viewer sind 1-basiert und einschließlich. Das Signal zeigt den Mittelwert jedes Bins mit angewendetem D4-Nenner. Vergrößern Sie schmale Peaks; ein flacher Bin kann Variationen enthalten.\n\nZiehen verschiebt die Ansicht; Umschalt+Ziehen wählt einen Bereich; Doppelklick vergrößert; Rechtsklick verkleinert. Klicken Sie in die Chromosomenübersicht, um zu springen. Zurück und Vorwärts stellen besuchte Regionen wieder her. Die Tastaturnavigation funktioniert, wenn der Plot den Fokus hat.\n\nDie Anzeigeeinstellungen steuern Auflösung, Farbe und feste Y-Skala aller Spuren. Höhe steuert die Spurzeilen. Die native Bildlaufleiste bewegt vertikal. Verwenden Sie beim Vergleich von Regionen eine feste Y-Skala. D4 kennzeichnet die Referenzassemblierung hier nicht: Annotationen müssen dieselbe Assemblierung und exakt übereinstimmende Chromosomennamen verwenden.\n\nBins exportieren schreibt die Mittelwerte der ausgewählten sichtbaren Spur als bedGraph (0-basiert, halboffen), nicht das ursprüngliche Signal pro Base."
