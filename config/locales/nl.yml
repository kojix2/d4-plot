    help_body: "Open een D4-bestand om alle sporen weer te geven. D4 toevoegen voegt nog een bestand toe. Selecteer een spoor via de titel of de lijst; Tonen, Omhoog, Omlaag en Uit weergave verwijderen beheren het spoor. Gedeelde Y vergelijkt zichtbare sporen op één schaal. Alle bestanden moeten dezelfde referentie-assemblage gebruiken.\nVoer chr:start-end, chr:position of een chromosoomnaam in en klik op Ga. Komma’s in coördinaten zijn toegestaan.\n\nCoördinaten in de viewer zijn 1-gebaseerd en inclusief. Het signaal toont het gemiddelde in elke bin, met toepassing van de D4-noemer. Zoom in om smalle pieken te onderscheiden; een vlakke bin kan variatie bevatten.\n\nSleep om te verschuiven; Shift+slepen om een bereik te selecteren; dubbelklik om in te zoomen; rechtsklik om uit te zoomen. Klik op het chromosoomoverzicht om te springen. Terug en Vooruit herstellen bezochte regio’s. Toetsenbordnavigatie werkt wanneer de plot focus heeft.\n\nWeergave-instellingen regelen resolutie, kleur en vaste Y-schaal voor alle sporen. Hoogte bepaalt de grootte van de spoorrijen. De systeemeigen schuifbalk beweegt verticaal. Gebruik een vaste Y-schaal bij het vergelijken van regio’s. D4 identificeert hier de referentie-assemblage niet: annotaties moeten dezelfde assemblage en exact overeenkomende chromosoomnamen gebruiken.\n\nBins exporteren schrijft de gemiddelden van het geselecteerde zichtbare spoor als bedGraph (0-gebaseerd, halfopen), niet het oorspronkelijke signaal per base."
