    help_body: "Ouvrez un fichier D4 pour afficher toutes ses pistes. Ajouter D4 ajoute un autre fichier. Sélectionnez une piste par son titre ou dans la liste ; Afficher, Monter, Descendre et Retirer de la vue permettent de la gérer. Y partagé compare les pistes visibles sur une même échelle. Tous les fichiers doivent utiliser le même assemblage de référence.\nSaisissez chr:start-end, chr:position ou un nom de chromosome, puis cliquez sur Aller. Les virgules sont acceptées dans les coordonnées.\n\nLes coordonnées du visualiseur sont indexées à partir de 1 et leurs bornes sont incluses. Le signal affiche la moyenne de chaque bin après application du dénominateur D4. Zoomez pour distinguer les pics étroits ; un bin plat peut contenir des variations.\n\nFaites glisser pour vous déplacer ; Maj+glisser pour sélectionner une plage ; double-cliquez pour zoomer ; cliquez avec le bouton droit pour dézoomer. Cliquez sur l’aperçu du chromosome pour vous déplacer. Précédent et Suivant restaurent les régions visitées. La navigation au clavier fonctionne lorsque le graphique a le focus.\n\nLes paramètres d’affichage contrôlent la résolution, la couleur et l’échelle Y fixe de toutes les pistes. Hauteur contrôle la taille des lignes de piste. La barre de défilement native déplace la vue verticalement. Utilisez une échelle Y fixe pour comparer des régions. D4 n’identifie pas ici l’assemblage de référence : les annotations doivent utiliser le même assemblage et des noms de chromosome strictement identiques.\n\nExporter les bins écrit les moyennes de la piste visible sélectionnée au format bedGraph (indexé à partir de 0, intervalle semi-ouvert), et non le signal d’origine base par base."
