    help_body: "Mở tệp D4 để hiển thị mọi track. Thêm D4 nối thêm một tệp khác. Chọn track bằng tiêu đề hoặc danh sách; dùng Hiện, Lên, Xuống và Xóa khỏi chế độ xem để quản lý. Dùng chung Y so sánh các track hiển thị trên cùng một thang. Tất cả tệp phải dùng cùng bộ lắp ráp tham chiếu.\nNhập chr:start-end, chr:position hoặc tên nhiễm sắc thể, rồi bấm Đi. Có thể dùng dấu phẩy trong tọa độ.\n\nTọa độ trong trình xem được đánh số từ 1 và gồm cả hai đầu. Tín hiệu hiển thị trung bình trong mỗi bin sau khi áp dụng mẫu số D4. Phóng to để phân giải các đỉnh hẹp; một bin phẳng vẫn có thể chứa biến thiên.\n\nKéo để dịch chuyển; Shift+kéo để chọn phạm vi; nhấp đúp để phóng to; nhấp chuột phải để thu nhỏ. Nhấp vào tổng quan nhiễm sắc thể để chuyển đến vị trí. Quay lại và Tiếp khôi phục các vùng đã xem. Có thể điều hướng bằng bàn phím khi biểu đồ có tiêu điểm.\n\nCài đặt hiển thị điều khiển độ phân giải, màu và thang Y cố định cho mọi track. Chiều cao điều khiển kích thước hàng track. Thanh cuộn gốc di chuyển theo chiều dọc. Dùng thang Y cố định khi so sánh các vùng. D4 không xác định bộ lắp ráp tham chiếu tại đây: chú giải phải dùng cùng bộ lắp ráp và tên nhiễm sắc thể khớp chính xác.\n\nXuất bin ghi trung bình của track hiển thị đã chọn dưới dạng bedGraph (đánh số từ 0, nửa mở), không phải tín hiệu gốc theo từng base."
