    help_title: "D4 Plot ব্যবহার"
    help_body: "একটি D4 ফাইলের সব ট্র্যাক দেখাতে সেটি খুলুন। D4 যোগ করুন আরেকটি ফাইল যুক্ত করে। শিরোনাম বা তালিকা থেকে একটি ট্র্যাক নির্বাচন করুন; দেখান, উপরে, নিচে ও সরান দিয়ে সেটি পরিচালনা করুন। ভাগ করা Y দৃশ্যমান ট্র্যাকগুলোকে একই স্কেলে তুলনা করে। সব ফাইলে একই রেফারেন্স অ্যাসেম্বলি থাকতে হবে।\nchr:start-end, chr:position অথবা ক্রোমোজোমের নাম লিখে যান ক্লিক করুন। স্থানাঙ্কে কমা গ্রহণযোগ্য।\n\nপ্রদর্শকের স্থানাঙ্ক ১-ভিত্তিক এবং উভয় প্রান্তসহ। D4 হর প্রয়োগ করে প্রতিটি বিনের গড় সংকেত দেখানো হয়। সরু শীর্ষ দেখতে বড় করুন; সমতল বিনের ভেতরেও তারতম্য থাকতে পারে।\n\nপ্যান করতে টানুন; সীমা নির্বাচন করতে Shift চেপে টানুন; বড় করতে ডাবল-ক্লিক এবং ছোট করতে ডান-ক্লিক করুন। লাফ দিতে ক্রোমোজোম ওভারভিউতে ক্লিক করুন। পিছনে ও সামনে আগে দেখা অঞ্চল ফিরিয়ে আনে। প্লটে ফোকাস থাকলে কিবোর্ড নেভিগেশন কাজ করে।\n\nপ্রদর্শন সেটিংস সব ট্র্যাকের রেজোলিউশন, রং ও স্থির Y স্কেল নিয়ন্ত্রণ করে। উচ্চতা ট্র্যাকের সারি নিয়ন্ত্রণ করে। নেটিভ স্ক্রলবার উল্লম্বভাবে সরায়। অঞ্চল তুলনার সময় স্থির Y স্কেল ব্যবহার করুন। D4 এখানে রেফারেন্স অ্যাসেম্বলি শনাক্ত করে না: টীকায় একই অ্যাসেম্বলি ও হুবহু মেলা ক্রোমোজোমের নাম থাকতে হবে।\n\nবিন রপ্তানি নির্বাচিত দৃশ্যমান ট্র্যাকের গড় bedGraph-এ (০-ভিত্তিক, অর্ধ-উন্মুক্ত) লেখে, মূল প্রতি-বেস সংকেত নয়।"
