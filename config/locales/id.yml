    help_body: "Buka berkas D4 untuk menampilkan semua treknya. Tambah D4 menambahkan berkas lain. Pilih trek melalui judul atau daftar; Tampilkan, Naik, Turun, dan Hapus dari tampilan digunakan untuk mengelolanya. Y bersama membandingkan trek terlihat pada satu skala. Semua berkas harus menggunakan perakitan referensi yang sama.\nMasukkan chr:start-end, chr:position, atau nama kromosom, lalu klik Buka. Koma diperbolehkan dalam koordinat.\n\nKoordinat pada penampil berbasis 1 dan inklusif. Sinyal menampilkan rata-rata setiap bin dengan penyebut D4 diterapkan. Perbesar untuk membedakan puncak sempit; bin datar dapat mengandung variasi.\n\nSeret untuk menggeser; Shift+seret untuk memilih rentang; klik ganda untuk memperbesar; klik kanan untuk memperkecil. Klik ikhtisar kromosom untuk berpindah. Kembali dan Maju memulihkan wilayah yang telah dikunjungi. Navigasi papan ketik bekerja saat plot mendapat fokus.\n\nPengaturan tampilan mengendalikan resolusi, warna, dan skala Y tetap untuk semua trek. Tinggi mengendalikan ukuran baris trek. Bilah gulir bawaan bergerak vertikal. Gunakan skala Y tetap saat membandingkan wilayah. D4 tidak mengidentifikasi perakitan referensi di sini: anotasi harus menggunakan perakitan yang sama dan nama kromosom yang persis sama.\n\nEkspor bin menulis rata-rata trek terlihat yang dipilih sebagai bedGraph (berbasis 0, setengah terbuka), bukan sinyal asli per basa."
