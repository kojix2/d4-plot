    could_not_export: "بن برآمد نہیں کیے جا سکے"
    help_title: "D4 Plot استعمال کرنا"
    help_body: "D4 فائل کے تمام ٹریک دکھانے کے لیے اسے کھولیں۔ D4 شامل کریں سے ایک اور فائل شامل ہوتی ہے۔ عنوان یا فہرست سے ٹریک منتخب کریں؛ دکھائیں، اوپر، نیچے اور منظر سے ہٹائیں سے اسے منظم کریں۔ مشترک Y دکھائی دینے والے ٹریک کا ایک پیمانے پر موازنہ کرتا ہے۔ تمام فائلوں میں ایک ہی حوالہ اسمبلی ہونی چاہیے۔\nchr:start-end، chr:position یا کروموسوم کا نام درج کریں، پھر جائیں پر کلک کریں۔ مختصات میں کوما قابل قبول ہیں۔\n\nناظر میں مختصات 1 پر مبنی اور دونوں سروں سمیت ہیں۔ سگنل D4 مخرج لاگو کر کے ہر بن کا اوسط دکھاتا ہے۔ تنگ چوٹیوں کے لیے بڑا کریں؛ ہموار بن میں بھی اندرونی تغیر ہو سکتا ہے۔\n\nسرکانے کے لیے گھسیٹیں؛ حد منتخب کرنے کے لیے Shift کے ساتھ گھسیٹیں؛ بڑا کرنے کے لیے ڈبل کلک اور چھوٹا کرنے کے لیے دایاں کلک کریں۔ چھلانگ لگانے کے لیے کروموسوم جائزے پر کلک کریں۔ پیچھے اور آگے دیکھے گئے خطے بحال کرتے ہیں۔ پلاٹ پر فوکس ہو تو کی بورڈ نیویگیشن کام کرتی ہے۔\n\nنمائش کی ترتیبات تمام ٹریک کی قرارداد، رنگ اور مقرر Y پیمانہ کنٹرول کرتی ہیں۔ اونچائی ٹریک قطاروں کو کنٹرول کرتی ہے۔ مقامی اسکرول بار عمودی حرکت کرتا ہے۔ خطوں کے موازنے کے لیے مقرر Y پیمانہ استعمال کریں۔ D4 یہاں حوالہ اسمبلی شناخت نہیں کرتا: تشریحات میں وہی اسمبلی اور بالکل یکساں کروموسوم نام ہونے چاہئیں۔\n\nبن برآمد منتخب دکھائی دینے والے ٹریک کے اوسط کو bedGraph (0 پر مبنی، نیم کھلا) میں لکھتا ہے، اصل فی-بیس سگنل کو نہیں۔"
