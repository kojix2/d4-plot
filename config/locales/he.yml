    export_conflict: "בחרו נתיב שונה מקובץ הקלט D4 או מקובץ האנוטציה."
    release_selection: "שחררו כדי לבחור טווח זה בכל הרצועות. Esc לביטול."
    preview_pan: "תצוגה מקדימה: %{region}. האזורים האפורים לא נקראו. שחררו כדי לטעון את כל הרצועות; Esc לביטול."
    help_body: "פתחו קובץ D4 כדי להציג את כל הרצועות שלו. הוספת D4 מצרפת קובץ נוסף. בחרו רצועה לפי הכותרת או מהרשימה; הצגה, למעלה, למטה והסרה מהתצוגה מנהלים אותה. Y משותף משווה רצועות גלויות בסולם אחד. כל הקבצים חייבים להשתמש באותה הרכבת ייחוס.\nהזינו chr:start-end, chr:position או שם כרומוזום ולחצו מעבר. ניתן להשתמש בפסיקים בקואורדינטות.\n\nהקואורדינטות במציג מבוססות 1 וכוללות את שני הקצוות. האות מציג את הממוצע בכל bin לאחר החלת מכנה D4. הגדילו כדי להבחין בשיאים צרים; bin שטוח עשוי להכיל שונות.\n\nגררו כדי להזיז; Shift+גרירה לבחירת טווח; לחיצה כפולה להגדלה; לחיצה ימנית להקטנה. לחצו על סקירת הכרומוזום כדי לקפוץ. אחורה וקדימה משחזרים אזורים שביקרתם בהם. ניווט במקלדת פועל כאשר התרשים ממוקד.\n\nהגדרות התצוגה שולטות ברזולוציה, בצבע ובסולם Y קבוע לכל הרצועות. גובה שולט בגודל שורות הרצועה. פס הגלילה המובנה נע אנכית. השתמשו בסולם Y קבוע בהשוואת אזורים. D4 אינו מזהה כאן את הרכבת הייחוס: אנוטציות חייבות להשתמש באותה הרכבה ובשמות כרומוזומים תואמים בדיוק.\n\nייצוא bins כותב את ממוצעי הרצועה הגלויה שנבחרה כ-bedGraph (מבוסס 0, חצי-פתוח), ולא את האות המקורי לכל בסיס."
