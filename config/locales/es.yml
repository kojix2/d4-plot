    help_body: "Abra un archivo D4 para mostrar todas sus pistas. Añadir D4 agrega otro archivo. Seleccione una pista mediante su título o la lista; Mostrar, Subir, Bajar y Quitar permiten administrarla. Y compartida compara las pistas visibles con una sola escala. Todos los archivos deben usar el mismo ensamblaje de referencia.\nIntroduzca chr:start-end, chr:position o el nombre de un cromosoma y pulse Ir. Se aceptan comas en las coordenadas.\n\nLas coordenadas del visor se basan en 1 e incluyen ambos extremos. La señal muestra la media de cada bin con el denominador D4 aplicado. Amplíe para resolver picos estrechos; un bin plano puede contener variación.\n\nArrastre para desplazarse; Mayús+arrastrar para seleccionar un intervalo; doble clic para ampliar; clic derecho para reducir. Pulse la vista general del cromosoma para saltar. Atrás y Adelante restauran las regiones visitadas. La navegación por teclado funciona cuando el gráfico tiene el foco.\n\nLos ajustes de visualización controlan la resolución, el color y la escala Y fija de todas las pistas. Altura controla el tamaño de las filas. La barra de desplazamiento nativa mueve la vista verticalmente. Use una escala Y fija al comparar regiones. D4 no identifica aquí el ensamblaje de referencia: las anotaciones deben usar el mismo ensamblaje y nombres de cromosoma idénticos.\n\nExportar bins escribe las medias de la pista visible seleccionada como bedGraph (basado en 0 y semiabierto), no la señal original por base."
