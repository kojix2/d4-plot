    help_body: "Abra um arquivo D4 para mostrar todas as faixas. Adicionar D4 acrescenta outro arquivo. Selecione uma faixa pelo título ou pela lista; Mostrar, Acima, Abaixo e Remover permitem gerenciá-la. Y compartilhado compara as faixas visíveis em uma única escala. Todos os arquivos devem usar a mesma montagem de referência.\nDigite chr:start-end, chr:position ou o nome de um cromossomo e clique em Ir. Vírgulas são aceitas nas coordenadas.\n\nAs coordenadas no visualizador são baseadas em 1 e inclusivas. O sinal mostra a média de cada bin com o denominador D4 aplicado. Amplie para distinguir picos estreitos; um bin plano pode conter variação.\n\nArraste para mover; Shift+arrastar para selecionar um intervalo; clique duas vezes para ampliar; clique com o botão direito para reduzir. Clique na visão geral do cromossomo para saltar. Voltar e Avançar restauram regiões visitadas. A navegação pelo teclado funciona quando o gráfico está em foco.\n\nAs configurações de exibição controlam resolução, cor e escala Y fixa de todas as faixas. Altura controla o tamanho das linhas das faixas. A barra de rolagem nativa move verticalmente. Use uma escala Y fixa ao comparar regiões. O D4 não identifica aqui a montagem de referência: as anotações devem usar a mesma montagem e nomes de cromossomo exatamente iguais.\n\nExportar bins grava as médias da faixa visível selecionada como bedGraph (baseado em 0, intervalo semiaberto), não o sinal original por base."
