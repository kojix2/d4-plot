    preview_pan: "Podgląd: %{region}. Szare obszary nie zostały odczytane. Zwolnij przycisk, aby wczytać wszystkie ścieżki; Esc anuluje."
    help_body: "Otwórz plik D4, aby wyświetlić wszystkie jego ścieżki. Dodaj D4 dołącza kolejny plik. Wybierz ścieżkę za pomocą tytułu lub listy; Pokaż, W górę, W dół i Usuń z widoku służą do zarządzania. Wspólna oś Y porównuje widoczne ścieżki na jednej skali. Wszystkie pliki muszą używać tego samego zestawu referencyjnego.\nWpisz chr:start-end, chr:position lub nazwę chromosomu, a następnie kliknij Przejdź. Współrzędne mogą zawierać przecinki.\n\nWspółrzędne w przeglądarce są liczone od 1 i włączne. Sygnał pokazuje średnią w każdym binie po zastosowaniu mianownika D4. Powiększ, aby rozróżnić wąskie piki; płaski bin może zawierać zmienność.\n\nPrzeciągnij, aby przesuwać; Shift+przeciągnięcie wybiera zakres; podwójne kliknięcie powiększa; kliknięcie prawym przyciskiem pomniejsza. Kliknij przegląd chromosomu, aby przejść do miejsca. Wstecz i Dalej przywracają odwiedzone regiony. Nawigacja klawiaturą działa, gdy wykres ma fokus.\n\nUstawienia wyświetlania sterują rozdzielczością, kolorem i stałą skalą Y wszystkich ścieżek. Wysokość steruje rozmiarem wierszy ścieżek. Natywny pasek przewijania przesuwa widok pionowo. Podczas porównywania regionów używaj stałej skali Y. D4 nie identyfikuje tutaj zestawu referencyjnego: adnotacje muszą używać tego samego zestawu i dokładnie zgodnych nazw chromosomów.\n\nEksportuj biny zapisuje średnie wybranej widocznej ścieżki jako bedGraph (od 0, przedział półotwarty), a nie oryginalny sygnał dla każdej zasady."
