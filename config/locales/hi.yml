    help_title: "D4 Plot का उपयोग"
    help_body: "किसी D4 फ़ाइल के सभी ट्रैक दिखाने के लिए उसे खोलें। D4 जोड़ें से दूसरी फ़ाइल जुड़ती है। शीर्षक या सूची से ट्रैक चुनें; दिखाएँ, ऊपर, नीचे और दृश्य से हटाएँ से उसे प्रबंधित करें। साझा Y सभी दृश्यमान ट्रैक की तुलना एक ही स्केल पर करता है। सभी फ़ाइलों में एक ही संदर्भ असेंबली होनी चाहिए।\nchr:start-end, chr:position या गुणसूत्र का नाम दर्ज करके जाएँ क्लिक करें। निर्देशांकों में कॉमा स्वीकार किए जाते हैं।\n\nदर्शक के निर्देशांक 1-आधारित और दोनों सिरों सहित हैं। सिग्नल D4 हर लागू करके प्रत्येक बिन का औसत दिखाता है। संकरी चोटियाँ देखने के लिए ज़ूम बढ़ाएँ; सपाट बिन के भीतर भी अंतर हो सकता है।\n\nपैन करने के लिए खींचें; सीमा चुनने के लिए Shift के साथ खींचें; ज़ूम बढ़ाने के लिए डबल-क्लिक और घटाने के लिए दायाँ-क्लिक करें। छलाँग लगाने के लिए गुणसूत्र अवलोकन पर क्लिक करें। पीछे और आगे पहले देखे गए क्षेत्र लौटाते हैं। प्लॉट पर फ़ोकस होने पर कीबोर्ड नेविगेशन काम करता है।\n\nप्रदर्शन सेटिंग सभी ट्रैक के रिज़ॉल्यूशन, रंग और स्थिर Y स्केल को नियंत्रित करती हैं। ऊँचाई ट्रैक पंक्तियों को नियंत्रित करती है। मूल स्क्रॉलबार लंबवत चलता है। क्षेत्रों की तुलना के लिए स्थिर Y स्केल उपयोग करें। D4 यहाँ संदर्भ असेंबली नहीं पहचानता: एनोटेशन में वही असेंबली और बिल्कुल समान गुणसूत्र नाम होने चाहिए।\n\nबिन निर्यात चयनित दृश्यमान ट्रैक के औसत को bedGraph (0-आधारित, अर्ध-खुला) में लिखता है, मूल प्रति-बेस सिग्नल को नहीं।"
