    could_not_export: "ビンを書き出せませんでした"
    help_title: "D4 Plot の使い方"
    help_body: "D4 を開くと現在のトラックと注釈を置き換えます。D4 を追加すると現在の表示にファイルを追加できます。どちらも複数選択できます。確認中にキャンセルすると前の表示を保持します。タイトルまたはリストでトラックを選び、表示・上へ・下へ・表示から外すで管理します。Y 軸を共有すると、表示中のトラックを一つのスケールで比較できます。すべてのファイルで同じリファレンスアセンブリを使用してください。\nchr:start-end、chr:position、または染色体名を入力して移動を押します。座標中のカンマも使用できます。\n\nビューアの座標は 1 始まり・両端を含みます。シグナルには D4 の分母を適用した各ビンの平均が表示されます。狭いピークを確認するには拡大してください。平坦なビンにも変動が含まれる場合があります。\n\nドラッグで移動、Shift+ドラッグまたは右ドラッグで範囲選択、ダブルクリックで拡大、右ダブルクリックで縮小します。染色体概要では、現在範囲の外をクリックすると表示範囲が移動します。戻る・進むで訪れた領域を復元できます。プロットにフォーカスがあるとキーボード操作もできます。\n\n表示設定では、全トラックの解像度、色、固定 Y 軸スケールを制御します。高さでトラックの行サイズを変更できます。ネイティブのスクロールバーで縦に移動します。領域を比較するには固定 Y 軸を使用してください。D4 にはアセンブリ識別子がないため、移動行の先頭で一致する公開ゲノムを選んでください。ローカルファイルはツールバーのアノテーションから開きます。ローカル注釈では染色体名の完全一致が必要です。\n\nビンを書き出すと、元の塩基ごとのシグナルではなく、選択した表示中トラックの平均を bedGraph（0 始まり・終端を含まない）で出力します。BigWig は D4 の全トラックを直接書き出します。"
