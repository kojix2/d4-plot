    help_body: "打开 D4 文件即可显示其中的所有轨道。添加 D4 可附加另一个文件。通过标题或列表选择轨道；使用显示、上移、下移和移除进行管理。共享 Y 轴可用同一比例比较可见轨道。所有文件必须使用相同的参考基因组组装版本。\n输入 chr:start-end、chr:position 或染色体名称，然后点击前往。坐标中可以使用逗号。\n\n查看器中的坐标从 1 开始并包含两端。信号显示每个区间应用 D4 分母后的平均值。放大可辨别狭窄峰；平坦区间中也可能存在变化。\n\n拖动可平移；Shift+拖动可选择范围；双击可放大；右键单击可缩小。点击染色体概览可跳转。后退和前进可恢复访问过的区域。绘图获得焦点时可以使用键盘导航。\n\n显示设置可控制所有轨道的分辨率、颜色和固定 Y 轴范围。高度控制轨道行的大小。使用原生滚动条可垂直移动。比较不同区域时请使用固定 Y 轴范围。D4 不在此处标识参考基因组组装版本：注释必须使用相同的组装版本和完全一致的染色体名称。\n\n导出区间会将所选可见轨道的平均值写为 bedGraph（0 基、半开区间），而不是原始的逐碱基信号。"
