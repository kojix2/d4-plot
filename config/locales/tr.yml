    preview_pan: "Önizleme: %{region}. Gri alanlar okunmadı. Tüm izleri yüklemek için bırakın; iptal etmek için Esc."
    help_body: "Tüm izlerini göstermek için bir D4 dosyası açın. D4 Ekle başka bir dosya ekler. Başlığı veya listeyi kullanarak bir iz seçin; Göster, Yukarı, Aşağı ve Görünümden kaldır ile yönetin. Paylaşılan Y, görünür izleri tek ölçekte karşılaştırır. Tüm dosyalar aynı referans derlemesini kullanmalıdır.\nchr:start-end, chr:position veya bir kromozom adı girip Git'e tıklayın. Koordinatlarda virgül kullanılabilir.\n\nGörüntüleyicide koordinatlar 1 tabanlıdır ve uçlar dahildir. Sinyal, D4 paydası uygulanmış olarak her bölmenin ortalamasını gösterir. Dar tepeleri çözmek için yakınlaştırın; düz bir bölme değişkenlik içerebilir.\n\nKaydırmak için sürükleyin; aralık seçmek için Shift+sürükleyin; yakınlaştırmak için çift tıklayın; uzaklaştırmak için sağ tıklayın. Atlamak için kromozom genel görünümüne tıklayın. Geri ve İleri ziyaret edilen bölgeleri geri yükler. Grafik odaktayken klavye ile gezinme çalışır.\n\nGörüntü ayarları tüm izlerin çözünürlüğünü, rengini ve sabit Y ölçeğini denetler. Yükseklik iz satırlarının boyutunu belirler. Yerel kaydırma çubuğu dikey hareket eder. Bölgeleri karşılaştırırken sabit Y ölçeği kullanın. D4 burada referans derlemesini tanımlamaz: ek açıklamalar aynı derlemeyi ve tam eşleşen kromozom adlarını kullanmalıdır.\n\nBölmeleri dışa aktar, özgün baz başına sinyal yerine seçili görünür izin ortalamalarını bedGraph (0 tabanlı, yarı açık) olarak yazar."
